name: Publish 20 new women-style pregnancy pins October 22
on:
  push:
    paths:
      - 'scripts/generate_new_20_women_oct22.py'
      - '.github/workflows/publish_new_20_women_oct22.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tooling
        run: python3 -m pip install pillow
      - name: Build high-resolution posters and bulk CSV
        run: python3 scripts/generate_new_20_women_oct22.py
      - name: Publish all 20 pins and CSV to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/pregnancy-women-batch6-new PINTEREST_NEW_20_WOMEN_BATCH6_UPLOAD.csv
          git diff --cached --quiet || (git commit -m "Publish new 20 pregnancy women Pins and verified CSV" && git push)
