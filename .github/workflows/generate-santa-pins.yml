name: Generate Santa Pinterest images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-santa-pins.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cairosvg
      - name: Render Santa pin images
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import random
          import cairosvg
          
          folder=Path("santa/images")
          folder.mkdir(parents=True,exist_ok=True)
          titles=[
          ("SANTA CAN","CALL YOUR KIDS!","VIDEO CALL"),
          ("WAIT...","SANTA IS CALLING!","INCOMING CALL"),
          ("TALK TO SANTA","HE TALKS BACK!","REAL CONVERSATIONS"),
          ("THE CUTEST","XMAS SURPRISE","PERSONALIZED"),
          ("BEDTIME STORIES","WITH SANTA","STORY TIME"),
          ("TELL SANTA","YOUR WISH LIST","WISH LIST"),
          ("A LETTER","FROM SANTA!","SANTA LETTER"),
          ("YOU MADE","THE NICE LIST!","NICE LIST"),
          ("COUNTDOWN TO","CHRISTMAS!","ADVENT CALENDAR"),
          ("MAKE MAGICAL","MEMORIES!","FAMILY MAGIC"),
          ]
          palette=[
          ("#6d0a25","#dd2749","#ffd46b"),("#092b45","#0e7380","#e5f8e7"),
          ("#063b31","#148a68","#ffe3a1"),("#521a55","#b34e8b","#ffe4bb"),
          ("#1b2558","#6d57ad","#f5cf7a"),("#5b1f13","#d76c40","#fff0bc"),
          ("#134b61","#44a6bd","#ffedbe"),("#25462c","#5c9574","#fff3ce"),
          ("#163157","#427db7","#faf4c5"),("#68192d","#c54058","#ffcf7e")]
          subtitles=["Video and voice calls with Santa","A magical surprise on your phone","Not just a prerecorded video","Let them hear Santa say their name","A cozy holiday ritual before sleep","Make wishes part of a conversation","Capture their words as a keepsake","A special certificate for kids","Discover surprises every December day","Call Santa together as a family"]
          for i, ((line1,line2,tag),(bg1,bg2,accent),subtitle) in enumerate(zip(titles,palette,subtitles),1):
              rng=random.Random(763+i*43)
              snow="".join(f'<circle cx="{rng.randint(20,980)}" cy="{rng.randint(45,1400)}" r="{rng.choice([2,3,4,6])}" fill="white" opacity="{rng.choice([.24,.34,.48,.65])}"/>' for j in range(90))
              xshift=[0,16,-12,24,-22,7,-7,18,-14,0][i-1]
              L=77 if len(line1)<15 else 68
              L2=72 if len(line2)>13 else 86
              svg=f"""<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500">
          <defs>
          <linearGradient id="bg" x2=".84" y2="1"><stop stop-color="{bg1}"/><stop offset="1" stop-color="{bg2}"/></linearGradient>
          <linearGradient id="screen" x2=".3" y2="1"><stop stop-color="#244e56"/><stop offset="1" stop-color="#051f32"/></linearGradient>
          <linearGradient id="red" x2="1" y2="1"><stop stop-color="#fb4c5e"/><stop offset="1" stop-color="#ae092b"/></linearGradient>
          <radialGradient id="halo"><stop stop-color="#fff5c9" stop-opacity=".75"/><stop offset="1" stop-color="#fff5c9" stop-opacity="0"/></radialGradient>
          <filter id="shadow"><feGaussianBlur stdDeviation="20"/></filter>
          </defs>
          <rect width="1000" height="1500" fill="url(#bg)"/>
          <circle cx="500" cy="850" r="600" fill="url(#halo)" opacity=".3"/>
          <circle cx="150" cy="780" r="190" fill="url(#halo)" opacity=".5"/>
          <circle cx="870" cy="1100" r="230" fill="url(#halo)" opacity=".45"/>
          {snow}
          <path d="M90 0V145 M920 0V95" stroke="white" opacity=".55" stroke-width="3"/>
          <circle cx="90" cy="168" r="25" fill="{accent}"/><circle cx="920" cy="118" r="18" fill="#fbd6d5"/>
          <rect x="155" y="65" rx="27" width="690" height="54" fill="white" fill-opacity=".19" stroke="white" stroke-opacity=".3"/>
          <text x="500" y="101" text-anchor="middle" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="white" letter-spacing="2">CHRISTMAS MAGIC  •  IPHONE APP</text>
          <text x="500" y="247" text-anchor="middle" font-family="DejaVu Sans" font-size="{L}" font-weight="900" fill="white">{line1}</text>
          <text x="500" y="345" text-anchor="middle" font-family="DejaVu Sans" font-size="{L2}" font-weight="900" fill="{accent}">{line2}</text>
          <text x="500" y="404" text-anchor="middle" font-family="DejaVu Sans" font-size="27" fill="white">{subtitle}</text>
          <path d="M104 1120l90-150-24 1 64-105 62 105-24-1 90 150z" fill="#053c36" opacity=".38"/>
          <path d="M700 1120l80-142-22 2 55-95 58 95-20-2 80 142z" fill="#0d2e35" opacity=".32"/>
          <rect x="96" y="1112" width="174" height="120" rx="9" fill="#efaf65"/>
          <path d="M175 1112v120M96 1165h174" stroke="#ad1f40" stroke-width="19"/>
          <rect x="755" y="1150" width="160" height="91" rx="8" fill="#df3c56"/>
          <path d="M835 1150v91M755 1193h160" stroke="#ffe4a8" stroke-width="17"/>
          <rect x="{226+xshift}" y="488" rx="77" width="548" height="774" fill="black" opacity=".36" filter="url(#shadow)"/>
          <rect x="{222+xshift}" y="475" rx="68" width="556" height="771" fill="#111827" stroke="#ffe4bb" stroke-width="9"/>
          <rect x="{239+xshift}" y="492" rx="54" width="522" height="735" fill="url(#screen)"/>
          <rect x="{394+xshift}" y="494" rx="16" width="220" height="26" fill="#10171d"/>
          <text x="{500+xshift}" y="564" text-anchor="middle" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#d4f8e5">NORTH POLE • LIVE CALL</text>
          <ellipse cx="{507+xshift}" cy="985" rx="178" ry="160" fill="#fff5e7"/>
          <path d="M{340+xshift} 839 Q{340+xshift} 685 {496+xshift} 654 Q{617+xshift} 637 {667+xshift} 761 Q{708+xshift} 766 {705+xshift} 829 L{667+xshift} 852z" fill="url(#red)"/>
          <circle cx="{706+xshift}" cy="822" r="49" fill="#fff9ec"/>
          <rect x="{329+xshift}" y="800" width="346" height="78" rx="39" fill="#fffaef"/>
          <ellipse cx="{502+xshift}" cy="929" rx="149" ry="166" fill="#fff9f1"/>
          <ellipse cx="{503+xshift}" cy="854" rx="119" ry="112" fill="#f8c5a3"/>
          <path d="M{388+xshift} 864 Q{503+xshift} 850 {617+xshift} 864 Q{633+xshift} 1036 {504+xshift} 1077 Q{371+xshift} 1036 {388+xshift} 864" fill="#fff9ed"/>
          <path d="M{435+xshift} 836Q{460+xshift} 826 {483+xshift} 839 M{519+xshift} 838Q{550+xshift} 825 {574+xshift} 835" fill="none" stroke="#f5f4ed" stroke-width="15" stroke-linecap="round"/>
          <circle cx="{457+xshift}" cy="862" r="7" fill="#31373d"/>
          <circle cx="{546+xshift}" cy="862" r="7" fill="#31373d"/>
          <circle cx="{454+xshift}" cy="859" r="36" fill="none" stroke="#bd9d66" stroke-width="6"/>
          <circle cx="{551+xshift}" cy="859" r="36" fill="none" stroke="#bd9d66" stroke-width="6"/>
          <path d="M{490+xshift} 860h22" stroke="#bd9d66" stroke-width="6"/>
          <ellipse cx="{502+xshift}" cy="899" rx="21" ry="16" fill="#eaa68c"/>
          <path d="M{502+xshift} 914Q{466+xshift} 886 {438+xshift} 925Q{472+xshift} 962 {504+xshift} 928Q{542+xshift} 966 {576+xshift} 921Q{547+xshift} 889 {502+xshift} 914" fill="#fff8ef"/>
          <path d="M{478+xshift} 971Q{503+xshift} 988 {528+xshift} 971" fill="none" stroke="#9e3a41" stroke-width="6" stroke-linecap="round"/>
          <circle cx="{395+xshift}" cy="1159" r="32" fill="white" fill-opacity=".2"/>
          <path d="M{381+xshift} 1146q-4 24 13 25q20 2 17-25" fill="none" stroke="white" stroke-width="5"/>
          <circle cx="{501+xshift}" cy="1159" r="40" fill="#e1304c"/>
          <path d="M{479+xshift} 1163 Q{500+xshift} 1144 {524+xshift} 1163" fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>
          <circle cx="{608+xshift}" cy="1159" r="32" fill="white" fill-opacity=".2"/>
          <rect x="{594+xshift}" y="1147" width="22" height="22" rx="4" fill="white"/>
          <rect x="220" y="1263" rx="30" width="560" height="58" fill="{accent}"/>
          <text x="500" y="1301" text-anchor="middle" font-family="DejaVu Sans" font-size="25" font-weight="900" fill="#20312e" letter-spacing="1.4">{tag}</text>
          <rect x="99" y="1352" rx="56" width="802" height="104" fill="#fff8eb" stroke="{accent}" stroke-width="8"/>
          <text x="500" y="1404" text-anchor="middle" font-family="DejaVu Sans" font-size="39" font-weight="900" fill="#a31c3b">TRY THE SANTA APP  →</text>
          <text x="500" y="1436" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#344243">Free to try • iPhone &amp; iPad</text>
          </svg>"""
              cairosvg.svg2png(bytestring=svg.encode(),write_to=str(folder/f"santa-pin-{i:02}.png"),output_width=1000,output_height=1500)
          print("Generated 10 original 1000x1500 PNG images.")
          PY
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add santa/images/
          if ! git diff --cached --quiet; then
            git commit -m "Add 10 Santa Pinterest pin images"
            git push
          fi
