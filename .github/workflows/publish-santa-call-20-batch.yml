name: Publish Santa Call 20
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-santa-call-20-batch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve twenty original individual scenes
        shell: bash
        run: |
          set -euo pipefail
          root=santa/new-video-call-fun-20
          mkdir -p "$root/sources"
          i=0
          while IFS= read -r id; do
            i=$((i + 1))
            file=$(printf 'scene-%02d.png' "$i")
            curl -fL --retry 4 --max-time 180 --silent --show-error "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:$id" -o "$root/sources/$file"
          done < "$root/source_image_ids.txt"
          test "$i" -eq 20
      - name: Create 20 independently full-resolution Pinterest Pins
        shell: bash
        run: |
          python -m pip install -q pillow
          python santa/new-video-call-fun-20/render_pins.py
      - name: Validate CSV and images
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from PIL import Image
          p=Path('santa/new-video-call-fun-20')
          with (p/'pinterest_santa_20_NEW.csv').open(newline='',encoding='utf-8') as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==20
          for i,row in enumerate(rows,1):
            name=f'santa-call-20-{i:02}.png'
            assert row['Media URL'].endswith('/'+name)
            assert row['Link'].startswith('https://apps.apple.com/us/app/call-santa-talk-video/id6808839679')
            with Image.open(p/'images'/name) as im:
              assert im.size==(1000,1500)
              im.verify()
          print('ALL 20 FILES AND CSV ROWS VERIFIED')
          PY
      - name: Upload final images to public GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add santa/new-video-call-fun-20/images/ santa/new-video-call-fun-20/preview_20.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish 20 individual full-resolution Santa video call images'
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
