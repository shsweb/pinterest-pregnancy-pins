name: Generate 40 Santa Pinterest Pins
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-40-santa-pins.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render dependencies
        run: python -m pip install cairosvg pillow
      - name: Create 40 pin images
        run: python santa/campaign-40/generate_pins.py
      - name: Publish images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add santa/campaign-40/images/
          if ! git diff --cached --quiet; then
            git commit -m "Publish forty colorful Santa Pinterest pins"
            git push
          fi
