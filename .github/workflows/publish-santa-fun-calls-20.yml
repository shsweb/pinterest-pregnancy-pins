          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --max-time 180 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:4a24159f-ff7c-4a9b-8035-cf9f1aabf69a' -o 'santa/santa-fun-calls-20/sources/source-16.png'
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --max-time 180 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:8389870b-3cd1-4ba7-943d-b265c171dbd9' -o 'santa/santa-fun-calls-20/sources/source-17.png'
