name: Publish Twenty Santa Fun Calls Pinterest Pins
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-santa-fun-calls-20.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download original individual artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p santa/santa-fun-calls-20/sources
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --max-time 180 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:c0727838-17b3-4fbf-9efe-8d11d5e485ac' -o 'santa/santa-fun-calls-20/sources/source-01.png'
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --max-time 180 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:34fc01c4-97de-4c56-97bf-f3986e1e3057' -o 'santa/santa-fun-calls-20/sources/source-02.png'
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --max-time 180 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:bda5e017-8f0d-4067-8674-8de7286a20e0' -o 'santa/santa-fun-calls-20/sources/source-03.png'
