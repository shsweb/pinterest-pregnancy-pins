          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --max-time 180 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:c712a41f-ed6b-4427-a272-18a0eda17242' -o 'santa/santa-fun-calls-20/sources/source-20.png'
      - name: Render 20 crisp original Santa scenes with verified English
        run: |
          python -m pip install --quiet pillow
          python santa/santa-fun-calls-20/render_pins.py
      - name: Commit and publish 20 images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add santa/santa-fun-calls-20/images/ santa/santa-fun-calls-20/preview_20.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish twenty distinct 1000x1500 Santa video-call pins"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
