name: Publish Santa October 22 New 20 Pins
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-santa-oct22-new20.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch all 20 independently generated Christmas scenes
        shell: bash
        run: |
          set -euo pipefail
          root=santa/fun-calls-new-20261022-20
          mkdir -p "$root/sources"
          i=0
          while IFS= read -r id; do
            i=$((i + 1))
            name=$(printf 'scene-%02d.png' "$i")
            curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --max-time 180 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:$id" -o "$root/sources/$name"
          done < "$root/source_ids.txt"
          test "$i" -eq 20
      - name: Build full-resolution 2:3 Pins and Pinterest bulk CSV
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python santa/fun-calls-new-20261022-20/build_and_validate.py
      - name: Publish images, preview and upload-ready CSV
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add santa/fun-calls-new-20261022-20/images/ santa/fun-calls-new-20261022-20/preview_20.jpg santa/fun-calls-new-20261022-20/pinterest_santa_20_BULK_READY.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish 20 new Santa Pins and upload-ready Pinterest CSV'
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
