name: Publish 20 approved-style pregnancy replacement pins
on:
  push:
    paths:
      - 'scripts/generate_women_batch5_approved.py'
      - '.github/workflows/generate_women_batch5_approved.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tooling
        run: python3 -m pip install pillow
      - name: Render exact approved style with readable typeset text
        run: python3 scripts/generate_women_batch5_approved.py
      - name: Publish 20 Pinterest images and CSV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/pregnancy-women-batch5-approved PINTEREST_20_APPROVED_STYLE_REPLACEMENT.csv
          git diff --cached --quiet || (git commit -m 'Publish approved-style Pinterest replacement batch of 20' && git push)
