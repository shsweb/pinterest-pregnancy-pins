name: Generate ten pregnancy Pinterest pins and CSV
on:
  push:
    paths:
      - 'generate_pins.py'
      - '.github/workflows/publish-pregnancy-pins.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install pillow
      - name: Generate PNG pins and final Pinterest CSV
        run: python3 generate_pins.py
      - name: Commit images and completed CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/pregnancy-quiz pinterest_bulk_ready.csv
          git diff --cached --quiet || (git commit -m "Publish 10 pregnancy pins and ready-to-upload CSV" && git push)
