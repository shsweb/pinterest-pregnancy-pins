name: Publish Women Pregnancy Batch 7
on:
  push:
    paths:
      - '.github/workflows/generate_pregnancy_women_batch7.yml'
      - 'scripts/generate_pregnancy_women_batch7.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install pillow
      - name: Generate 20 portraits and Pinterest CSV
        run: python3 scripts/generate_pregnancy_women_batch7.py
      - name: Commit ready pin images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/pregnancy-women-batch7 PINTEREST_NEW_20_WOMEN_BATCH7_READY.csv
          git diff --cached --quiet || (git commit -m "Publish 20 pregnancy women-style pins batch 7" && git push)
