name: Render 30 Santa Pinterest Pins
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-30-santa-pins.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cairosvg pillow
      - name: Render 30 Santa images
        run: python santa/campaign-30/generate_pins.py
      - name: Commit finished images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add santa/campaign-30/images/
          if ! git diff --cached --quiet; then
            git commit -m "Publish 30 Santa Pinterest designs"
            git push
          fi

# Rebuild after fixing 30-pin rendering script
